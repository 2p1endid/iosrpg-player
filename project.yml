name: IOSRPGPlayer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  IOSRPGPlayer:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: shared/GameFileRules.swift
      - path: shared/GameProjectInspector.swift
      - path: shared/GameLibraryStore.swift
      - path: shared/SafeZIPExtractor.swift
      - path: Resources/TestGame
        type: folder
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iosrpgplayer
        PRODUCT_NAME: IOSRPGPlayer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - IOSRPGPlayerTests
  IOSRPGPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests/GameFileRulesTests.swift
    dependencies:
      - target: IOSRPGPlayer
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iosrpgplayer.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IOSRPGPlayer.app/IOSRPGPlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
