name: RRPPGo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  RRPPGo:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: shared/GameFileRules.swift
      - path: shared/GameProjectInspector.swift
      - path: shared/GameLibraryStore.swift
      - path: shared/SafeZIPExtractor.swift
      - path: shared/GameResourceResolver.swift
      - path: shared/ProgressFileCopier.swift
      - path: shared/GameImportPickerState.swift
      - path: shared/LocalGameHTTPRoute.swift
      - path: shared/GameHTTPNavigationDiagnostic.swift
      - path: shared/GameRuntimeDiagnostic.swift
      - path: shared/GameRuntimeDiagnosticFormatter.swift
      - path: shared/VirtualInputMapping.swift
      - path: shared/VirtualInputScriptBuilder.swift
      - path: shared/GameViewportSizing.swift
      - path: shared/GameRuntimeCompatibilityPatcher.swift
      - path: shared/GameBrowserCapabilityScript.swift
      - path: shared/GameVirtualInputBridgeScript.swift
      - path: shared/GameControllerLayout.swift
      - path: shared/GameViewportBridgeScript.swift
      - path: shared/AppLanguage.swift
      - path: Resources/TestGame
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rrppgo
        PRODUCT_NAME: RRPPGo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "0.1.0.1"
        CURRENT_PROJECT_VERSION: "14.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - RRPPGoTests
  RRPPGoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests/GameFileRulesTests.swift
    dependencies:
      - target: RRPPGo
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rrppgo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RRPPGo.app/RRPPGo"
        BUNDLE_LOADER: "$(TEST_HOST)"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

