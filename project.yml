name: IOSRPGPlayer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  IOSRPGPlayer:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: shared
      - path: Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iosrpgplayer
        PRODUCT_NAME: IOSRPGPlayer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iOS RPG Player
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - IOSRPGPlayerTests
  IOSRPGPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests
    dependencies:
      - target: IOSRPGPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iosrpgplayer.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IOSRPGPlayer.app/IOSRPGPlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"
